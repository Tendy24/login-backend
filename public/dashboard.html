<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 50px auto;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2ecc71;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .logout-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background: #e74c3c;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .debug-toast {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #2ecc71;
            color: #102014;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            display: none;
            z-index: 999;
        }

        .profile-card {
            margin-top: 18px;
            border: 1px solid #3b3b3b;
            border-radius: 8px;
            padding: 14px;
            background: #242424;
        }

        .profile-card h2 {
            margin: 0 0 8px;
            font-size: 16px;
            color: #8ecdf8;
        }

        .profile-card p {
            margin: 6px 0;
            font-size: 14px;
            color: #e0e0e0;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <h1>Welcome to Your Secure Dashboard</h1>
        <p id="dashboardMessage">Verifying your secure session...</p>
        <p>This page is being served statically from your backend server infrastructure.</p>
        <div class="profile-card">
            <h2>Profile</h2>
            <p id="profileEmail">Email: loading...</p>
            <p id="profileId">User ID: loading...</p>
        </div>
        <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
    <div id="debugToast" class="debug-toast">Session refreshed (dev)</div>

    <script>
        const DEV_MODE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        function showDebugToast(message) {
            if (!DEV_MODE) {
                return;
            }

            const toast = document.getElementById('debugToast');
            if (!toast) {
                return;
            }

            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 1800);
        }

        function clearSession() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('refreshToken');
        }

        async function refreshAccessToken() {
            const refreshToken = localStorage.getItem('refreshToken');
            if (!refreshToken) {
                return null;
            }

            try {
                const refreshResponse = await fetch('/api/refresh-token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ refreshToken })
                });

                const refreshResult = await refreshResponse.json();

                if (!refreshResponse.ok || !refreshResult.success || !refreshResult.token || !refreshResult.refreshToken) {
                    return null;
                }

                localStorage.setItem('authToken', refreshResult.token);
                localStorage.setItem('refreshToken', refreshResult.refreshToken);
                showDebugToast('Session refreshed (dev)');
                return refreshResult.token;
            } catch (error) {
                return null;
            }
        }

        async function fetchDashboardData(token) {
            const response = await fetch('/api/dashboard-data', {
                method: 'GET',
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

            const result = await response.json();
            return { response, result };
        }

        async function fetchProfileData(token) {
            const response = await fetch('/api/me', {
                method: 'GET',
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

            const result = await response.json();
            return { response, result };
        }

        async function withAutoRefresh(fetcher, token) {
            let accessToken = token;
            let attempt = await fetcher(accessToken);

            if (attempt.response.status === 403) {
                const newAccessToken = await refreshAccessToken();
                if (newAccessToken) {
                    accessToken = newAccessToken;
                    attempt = await fetcher(accessToken);
                }
            }

            return attempt;
        }

        async function loadDashboardData() {
            const token = localStorage.getItem('authToken');
            const messageEl = document.getElementById('dashboardMessage');

            if (!token) {
                window.location.href = '/';
                return;
            }

            try {
                const dashboardAttempt = await withAutoRefresh(fetchDashboardData, token);
                const profileAttempt = await withAutoRefresh(fetchProfileData, localStorage.getItem('authToken'));

                const { response, result } = dashboardAttempt;

                if (!response.ok || !result.success) {
                    clearSession();
                    window.location.href = '/';
                    return;
                }

                if (!profileAttempt.response.ok || !profileAttempt.result.success || !profileAttempt.result.user) {
                    clearSession();
                    window.location.href = '/';
                    return;
                }

                messageEl.innerText = result.message;
                document.getElementById('profileEmail').innerText = `Email: ${profileAttempt.result.user.email}`;
                document.getElementById('profileId').innerText = `User ID: ${profileAttempt.result.user.id}`;
            } catch (error) {
                messageEl.innerText = 'Unable to verify session with the server.';
            }
        }

        async function logout() {
            const token = localStorage.getItem('authToken');

            try {
                if (token) {
                    await fetch('/api/logout', {
                        method: 'POST',
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    });
                }
            } catch (error) {
                // Ignore network/logout errors and proceed with client-side cleanup.
            } finally {
                clearSession();
                // Return the user back to the login page
                window.location.href = '/';
            }
        }

        loadDashboardData();
    </script>

</body>

</html>
