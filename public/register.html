<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="/auth-pages.css">
</head>

<body class="auth-page auth-light">

    <div class="auth-card auth-card-light">
        <h2>Sign Up</h2>
        <form id="registerForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Choose Password" required>
            <button type="submit">Register Account</button>
        </form>
        <div id="messageBox" class="msg"></div>
        <div class="link">Already have an account? <a href="/index.html">Log In</a></div>
    </div>

    <script src="/auth-pages.js"></script>
    <script>
        setupRegisterForm();
    </script>

</body>

</html>
