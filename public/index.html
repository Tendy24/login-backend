<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <link rel="stylesheet" href="/auth-pages.css">
</head>

<body class="auth-page auth-dark">

    <div class="auth-card auth-card-dark">
        <h2>Sign In</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="submitBtn">Login</button>
        </form>
        <div id="messageBox" class="message"></div>
        <div class="link">Need an account? <a href="/register.html">Create one</a></div>
    </div>

    <script src="/auth-pages.js"></script>
    <script>
        setupLoginForm();
    </script>

</body>

</html>
